[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "materials-mcp-optimade"
version = "0.1.0a1"
description = "Bounded, provenance-preserving OPTIMADE federation for Materials MCP Commons."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Hesham Salama" },
]
dependencies = [
  "materials-mcp-commons==0.1.0a13",
  "optimade==1.5.0",
]

[project.optional-dependencies]
mcp-host = ["mcp>=2.2,<2.3"]

[project.scripts]
materials-mcp-optimade-host = "materials_mcp_optimade.host:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mcp>=2.2,<2.3",
  "packaging>=26,<27",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/materials_mcp_optimade"]

[tool.hatch.build.targets.sdist]
include = [
  "/conformance",
  "/docs",
  "/schemas",
  "/src",
  "/tests",
  "/tools",
  "/LICENSE",
  "/LICENSE-DOCS.md",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/conformance/install-lifecycle-*.json",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=materials_mcp_optimade",
  "--cov-branch",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: fixed-authority network tests against real providers",
]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv]
required-version = ">=0.9.18"

[tool.uv.sources]
materials-mcp-commons = { path = "../..", editable = true }
